pluginGroup=dev.odot
pluginVersion=0.1.0

# IntelliJ IDEA Community as the platform base; the plugin depends only on
# com.intellij.modules.platform so it installs in every JetBrains IDE.
platformType=IC
platformVersion=2023.2
pluginSinceBuild=232

org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false

# The IntelliJ Platform already ships the Kotlin stdlib; do not bundle another copy.
kotlin.stdlib.default.dependency=false
